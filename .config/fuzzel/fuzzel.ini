# Fuzzel (launcher)
# Lokasi : ~/.config/fuzzel/fuzzel.ini
# Cek sintaks: fuzzel --check-config

[main]
font=Ubuntu:size=12
terminal=kitty
icon-theme=Papirus-Dark
icons-enabled=yes
prompt="> "
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8
layer=overlay

[colors]
background=181818ee
text=eeeeeeff
input=eeeeeeff
prompt=7aa2f7ff
match=7aa2f7ff
selection=333333ff
selection-text=ffffffff
selection-match=7aa2f7ff
border=444444ff

[border]
width=1
radius=8
