# Kitty (terminal)
# Lokasi : ~/.config/kitty/kitty.conf

font_family Ubuntu Mono
font_size 12.0

background #181818
foreground #eeeeee
background_opacity 0.95
cursor #7aa2f7
selection_background #333333
selection_foreground #ffffff

window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no
copy_on_select clipboard

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
